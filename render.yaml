services:
  - type: web
    name: intelliformat
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    disk:
      - name: uploads
        mountPath: /app/uploads
        sizeGB: 1
      - name: output
        mountPath: /app/output
        sizeGB: 1