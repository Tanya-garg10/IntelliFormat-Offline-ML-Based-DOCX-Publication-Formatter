services:
  - type: web
    name: intelliformat
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
    disk:
      - name: uploads
        mountPath: /app/uploads
        sizeGB: 1
      - name: output
        mountPath: /app/output
        sizeGB: 1