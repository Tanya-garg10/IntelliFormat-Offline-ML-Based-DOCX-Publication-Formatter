version: '3.8'

services:
  intelliformat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelliformat-app
    ports:
      - "3000:3000"
    volumes:
      # Persist uploaded files
      - ./uploads:/app/uploads
      # Persist output files
      - ./output:/app/output
      # Mount samples directory for testing
      - ./samples:/app/samples
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - intelliformat-network

networks:
  intelliformat-network:
    driver: bridge